name: CI/CD

on:
  push:
    branches: [main, stg]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform
      - run: terraform fmt -check -recursive
        working-directory: terraform

  # stg -> staging, main -> production. Each deploy job needs a GitHub Environment of the same
  # name — provisioned by terraform/ci-cd.tf, along with the AWS_ROLE_TO_ASSUME variable each
  # job reads below (OIDC, no long-lived AWS keys). Both deploy jobs run the same command
  # against the same shared Terraform config — only the backend key and the `env` var differ —
  # so staging is a genuine rehearsal of the exact mechanism that later touches production, not
  # a different, untested path.
  deploy-staging:
    name: Deploy to staging
    needs: [lint, test, terraform-validate]
    if: github.ref == 'refs/heads/stg' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_env: stg
      TF_VAR_notification_email: shaibu.samuel@yahoo.com
      # Only stg's apply actually manages these (see ci-cd.tf's `manage_ci_cd` gate) — passed
      # here too so a CI-driven apply can't silently fall back to the unset default (null) and
      # remove the production reviewer gate that was set locally when this was bootstrapped.
      TF_VAR_production_approver_github_user_id: 57644935
      # The `github` provider in ci-cd.tf reads this env var directly — it has nothing to do
      # with AWS auth above. A repo-admin-scoped PAT, not the default Actions token, since
      # managing environments/reviewers/variables via the API needs repo-admin rights the
      # default token doesn't have. Secret can't be named GITHUB_TOKEN (GitHub reserves that
      # prefix) so it's stored as TF_GITHUB_TOKEN and remapped here.
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-north-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform init -backend-config=config/stg.hcl
        working-directory: terraform
      - run: terraform apply -auto-approve
        working-directory: terraform

  deploy-production:
    name: Deploy to production
    needs: [lint, test, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_env: prd
      TF_VAR_notification_email: shaibu.samuel@yahoo.com
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-north-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform init -backend-config=config/prd.hcl
        working-directory: terraform
      - run: terraform apply -auto-approve
        working-directory: terraform
